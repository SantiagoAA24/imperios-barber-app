<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mi horario — Imperio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer;text-align:center}
button:focus-visible{outline:2px solid #D4AF5A;outline-offset:2px}
</style>
</helmet>
<div style="position:relative;width:390px;height:1180px;box-sizing:border-box;background:#0B0B0C;color:#F4EFE4;font-family:Inter,system-ui,sans-serif;padding:20px 20px 0;display:flex;flex-direction:column;gap:24px">

<header style="display:flex;align-items:center;gap:12px">
<img src="../../design-system/assets/Logo/imperio-sello.png" alt="Logo de Barbería Imperio" style="width:44px;height:44px;border-radius:50%">
<div style="display:flex;flex-direction:column;flex:1;min-width:0">
<span style="font-size:13px;line-height:18px;color:#A9A293">[Barbero 1]</span>
<h1 style="margin:0;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:30px;line-height:34px">Mi horario</h1>
</div>
</header>

<section style="display:flex;flex-direction:column;gap:14px">
<h2 style="margin:0;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:26px;line-height:32px">Días de trabajo</h2>
<sc-for list="{{days}}" as="d" hint-placeholder-count="7">
<div style="display:flex;align-items:center;gap:8px;box-sizing:border-box;min-height:60px;padding:6px 6px 6px 16px;border-radius:14px;background:#151517;border:1px solid #2A2A2D">
<span style="flex:0 0 74px;font-size:15px;line-height:22px;font-weight:600">{{ d.name }}</span>
<sc-if value="{{ d.on }}" hint-placeholder-val="{{ true }}">
<button type="button" style="flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;padding:0 12px;border-radius:12px;background:#0B0B0C;border:1px solid #6B665B;font-size:14px;font-weight:500">{{ d.range }}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D4AF5A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
</sc-if>
<sc-if value="{{ d.off }}" hint-placeholder-val="{{ false }}">
<span style="flex:1;font-size:14px;line-height:21px;color:#A9A293">Día libre</span>
</sc-if>
<button type="button" role="switch" aria-checked="{{ d.on }}" aria-label="Trabajo este día" style="flex:0 0 48px;height:44px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;padding:0"><span style="display:flex;align-items:center;width:44px;height:26px;box-sizing:border-box;padding:3px;border-radius:999px;{{ d.track }}"><span style="width:20px;height:20px;border-radius:50%;background:#0B0B0C;{{ d.thumb }}"></span></span></button>
</div>
</sc-for>
</section>

<section style="display:flex;flex-direction:column;gap:14px">
<h2 style="margin:0;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:26px;line-height:32px">Horas bloqueadas</h2>
<div style="display:flex;align-items:center;gap:12px;box-sizing:border-box;padding:12px 8px 12px 16px;border-radius:14px;background:#151517;border:1px solid #2A2A2D">
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;line-height:22px;font-weight:600">Hoy · 1:00 pm – 2:00 pm</span><span style="font-size:12.5px;line-height:18px;color:#A9A293">Almuerzo</span></div>
<button type="button" aria-label="Quitar bloqueo" style="width:44px;height:44px;border:0;border-radius:12px;background:transparent;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E57A6B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12M10 11v5M14 11v5"/></svg></button>
</div>
<button type="button" style="display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border-radius:14px;background:#151517;border:1px solid #6B665B;color:#F4EFE4;font-size:16px;font-weight:600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D4AF5A" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Bloquear horas</button>
<div style="display:flex;gap:10px;align-items:flex-start;font-size:12.5px;line-height:18px;color:#A9A293">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D4AF5A" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" style="flex:0 0 auto;margin-top:1px"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
<span>Las horas bloqueadas no aparecen como disponibles cuando un cliente agenda.</span>
</div>
</section>

<nav aria-label="Navegación del barbero" style="position:absolute;left:0;right:0;bottom:0;height:76px;box-sizing:border-box;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:#151517;border-top:1px solid #2A2A2D">
<button type="button" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;background:transparent;color:#A9A293;font-size:12px;font-weight:500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Agenda</button>
<button type="button" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;background:transparent;color:#A9A293;font-size:12px;font-weight:500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Nueva cita</button>
<button type="button" aria-current="page" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;background:transparent;color:#D4AF5A;font-size:12px;font-weight:600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Mi horario</button>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    const D = [
      ['Lunes', '10:00 am – 6:00 pm'], ['Martes', '10:00 am – 6:00 pm'], ['Miércoles', '10:00 am – 6:00 pm'],
      ['Jueves', '10:00 am – 6:00 pm'], ['Viernes', '10:00 am – 6:00 pm'], ['Sábado', '9:00 am – 6:00 pm'], ['Domingo', '10:00 am – 2:00 pm']
    ];
    return {
      days: D.map((d) => ({ name: d[0], range: d[1], on: true, off: false, track: 'justify-content:flex-end;background:#D4AF5A;', thumb: '' }))
    };
  }
}
</script>
</body>
</html>
