name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: imperio
          POSTGRES_PASSWORD: imperio
          POSTGRES_DB: imperio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U imperio -d imperio"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://imperio:imperio@localhost:5432/imperio
      JWT_SECRET: secreto-solo-para-ci-0123456789abcdef0123456789
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: pnpm install --frozen-lockfile
      - run: (cd apps/api && uv sync --locked)
      # Regenera tokens.css, openapi.json y schema.d.ts; si algo cambia, el esquema estaba desactualizado.
      - run: make types
      - run: git diff --exit-code
      - run: pnpm --filter web lint
      - run: pnpm --filter web lint:colors
      - run: pnpm --filter web format:check
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web test
      - run: pnpm --filter web build
