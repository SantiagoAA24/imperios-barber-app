<!-- @dsCard group="Estructura" height=180 subtitle="Aviso con icono: información, éxito y error" -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>body{margin:0;padding:20px;background:var(--bg);color:var(--text);font-family:var(--font-sans)}</style>
</head>
<body>
<div style="display:flex;flex-direction:column;gap:14px;max-width:350px">
<div class="imp-notice"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d4af5a" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Llega puntual: la tolerancia máxima es de 5 minutos después de la hora pactada.</span></div>
<div class="imp-notice imp-notice--success"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/></svg><span>Cita confirmada. Te llegará un recordatorio por WhatsApp.</span></div>
<div class="imp-notice imp-notice--danger"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg><span>Esa hora ya no está disponible. Elige otra.</span></div>
</div>
</body>
</html>
