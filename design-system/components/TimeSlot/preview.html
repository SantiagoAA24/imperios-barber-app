<!-- @dsCard group="Selección" height=190 subtitle="Cuadrícula de horas: disponible, seleccionada y no disponible" -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>body{margin:0;padding:20px;background:var(--bg);color:var(--text);font-family:var(--font-sans)}</style>
</head>
<body>
<div class="imp-slots" style="max-width:350px">
<button class="imp-slot" aria-pressed="false">10:00 am</button>
<button class="imp-slot" aria-pressed="false">10:30 am</button>
<button class="imp-slot" aria-pressed="true">11:00 am</button>
<button class="imp-slot" aria-pressed="false" disabled>11:30 am</button>
<button class="imp-slot" aria-pressed="false" disabled>12:00 pm</button>
<button class="imp-slot" aria-pressed="false">12:30 pm</button>
<button class="imp-slot" aria-pressed="false">1:00 pm</button>
<button class="imp-slot" aria-pressed="false">1:30 pm</button>
</div>
</body>
</html>
